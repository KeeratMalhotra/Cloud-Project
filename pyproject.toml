[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgesim"
version = "0.1.0"
description = "Shared 6G edge-cloud simulator, datasets, and agents for the EdgePlus reproduction and EdgePlus-PEC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31",
    "gdown>=5.1",
]

[project.optional-dependencies]
rl = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
