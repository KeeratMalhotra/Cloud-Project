# System presets: overrides applied on top of configs/sim.yaml (docs/Simulator.md).
# They change system features only; the scheduling policy is chosen separately.

edgeplus:                        # as described in the EdgePlus paper
  queue: {discipline: fifo, predictor: backlog}
  mask: {infeasible: best_effort, calibrated: false}
  dispatch: {allow_reject: false}
  mobility: {mode: distress}

edgeplus_literal:                # EdgePlus with its Kingman queue surrogate in the mask (Eq. 31)
  queue: {discipline: fifo, predictor: kingman}
  mask: {infeasible: best_effort, calibrated: false}
  dispatch: {allow_reject: false}
  mobility: {mode: distress}

edgeplus_plus:                   # EdgePlus plus slice-priority queues and hopeless-task rejection (review I-4, I-9);
  queue: {discipline: slice_priority, predictor: backlog}   # used for the rule-based results in docs/Simulator.md
  mask: {infeasible: reject, calibrated: false}
  dispatch: {allow_reject: false}
  mobility: {mode: distress}

# EdgePlus-PEC: EdgePlus plus three system improvements (Priority queues, Energy-aware execution and mobility,
# fast Consensus). The scheduler (masked CCPPO, advisory, PSO, ledger feedback) is unchanged.
edgeplus_pec:
  queue: {discipline: slice_priority, predictor: backlog}
  mask: {infeasible: best_effort, calibrated: false}
  dispatch: {allow_reject: false}
  mobility: {mode: distress, serve_remote: true, distress_persist_steps: 2, donor_order: near}
  energy: {dvfs: {enabled: true}}
  ledger: {consensus: {timeout_s: 0.5, global_period_s: 0.5}}

# One improvement at a time on top of EdgePlus (ablations)
edgeplus_pq:
  queue: {discipline: slice_priority, predictor: backlog}
  mask: {infeasible: best_effort, calibrated: false}
  dispatch: {allow_reject: false}
  mobility: {mode: distress}

edgeplus_energy:
  queue: {discipline: fifo, predictor: backlog}
  mask: {infeasible: best_effort, calibrated: false}
  dispatch: {allow_reject: false}
  mobility: {mode: distress, serve_remote: true, distress_persist_steps: 2, donor_order: near}
  energy: {dvfs: {enabled: true}}

edgeplus_cons:
  queue: {discipline: fifo, predictor: backlog}
  mask: {infeasible: best_effort, calibrated: false}
  dispatch: {allow_reject: false}
  mobility: {mode: distress}
  ledger: {consensus: {timeout_s: 0.5, global_period_s: 0.5}}
