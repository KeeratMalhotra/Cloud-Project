# Learned methods for the EdgePlus reproduction (EdgePlus Sec. IV-D, Table VI). Every method gets the same
# training budget (decisions), the same episode stream, and the same warm start. `sim` overrides
# configs/sim.yaml on top of the `system` preset; `ppo`, `reward`, and `advisory` override the trainer
# defaults (advisory: null = off).
#
# Shared protocol (chosen on CityPulse validation days, Nov 2026; see docs/EdgePlus_Reproduction.md):
#   * warm start: the first 300k decisions follow greedy EFT and the actor imitates it; the imitation term
#     then fades out over half of the remaining budget. Without it, PPO from scratch reached 61-66% at 150k
#     against 80% for greedy EFT; with it, 79%.
#   * PPO: lr 3e-4, gamma 0.9, 1024 steps x 8 envs per update, entropy 0.003, latency weight 0.5.

defaults:
  system: edgeplus
  budget_decisions: 1500000
  ppo:
    train_horizon_s: 600.0
    gamma: 0.9
    steps_per_iter: 1024
    ent_coef: 0.003
    bc_decisions: 300000
  reward: {eta_lat: 0.5}
  loads: {50000: 1, 100000: 1, 150000: 2}

methods:
  A1_full:            # full EdgePlus: masks, advisory, PSO (paper's SLA gate), ledger
    advisory: {}
    pso: {gate: paper}
  A2_no_pso:
    advisory: {}
    pso: null
  A3_no_advisory:
    advisory: null
    pso: {gate: paper}
  A4_no_ledger:
    advisory: {}
    pso: {gate: paper}
    sim: {ledger.feedback: false}
    reward: {ledger_shaping: false}
  A5_no_masks:
    advisory: {}
    pso: {gate: paper}
    sim: {mask.level: none}
  A6_plain_ccppo:
    advisory: null
    pso: null
    sim: {mask.level: none, ledger.feedback: false}
    reward: {ledger_shaping: false}
  ccppo_lagr:         # no masks, advisory and PSO off, Lagrangian penalty on deadline misses
    advisory: null
    pso: null
    sim: {mask.level: none}
    ppo: {lagrangian: true}
  ensemble_ppo:       # bootstrap ensemble of PPO actor heads, one shared actor (inherits masks and ledger)
    advisory: null
    pso: null
    ppo: {per_site_actors: false, ensemble: 3}
  A1_relgate:         # our improvement I-5: PSO accepts gains that raise success without raising cloud use
    advisory: {}
    pso: {gate: relative}
